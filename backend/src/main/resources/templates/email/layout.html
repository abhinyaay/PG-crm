<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
        <tr>
          <td style="background-color:#0f766e;padding:18px 24px;color:#ffffff;font-size:18px;font-weight:600;letter-spacing:0.2px;">{{brand}}</td>
        </tr>
        <tr>
          <td style="padding:28px 24px 8px 24px;">
            <h1 style="margin:0 0 16px 0;font-size:20px;line-height:28px;font-weight:600;color:#111827;">{{title}}</h1>
            {{content}}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px 24px 24px;border-top:1px solid #e5e7eb;font-size:12px;line-height:18px;color:#6b7280;">{{footer}}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
