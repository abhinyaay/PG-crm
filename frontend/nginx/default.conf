# Static server for the StayDesk SPA (built by Vite into /usr/share/nginx/html).
# In production this container sits behind the main nginx, which routes /api/** and /analytics/** to the
# services and everything else here, so the SPA and the APIs share one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    # Fingerprinted build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app shell and the service worker must always be revalidated so new deploys are picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API traffic belongs to the edge proxy; never answer it with the SPA shell.
    location ~ ^/(api|analytics)/ {
        default_type application/json;
        return 404 '{"status":404,"code":"NOT_FOUND","message":"API is not served by the frontend container"}';
    }

    # Client-side routes (history API): fall back to the app shell (served via the no-cache location above).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
