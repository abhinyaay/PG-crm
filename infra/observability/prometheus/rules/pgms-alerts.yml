# Basic alert rules for the pgms backend. There is no Alertmanager in the local stack: firing alerts are visible at
# http://127.0.0.1:58301/alerts and can be wired to Alertmanager / Grafana alerting later.
# Validate after editing:  make observability-check   (runs promtool inside the prometheus image)
groups:
  - name: pgms-recording
    interval: 30s
    rules:
      # API traffic only (actuator probes and scrapes excluded)
      - record: pgms:http_requests:rate5m
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
      - record: pgms:http_5xx:rate5m
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*", status=~"5.."}[5m]))
      - record: pgms:http_latency_avg:5m
        expr: |
          sum by (application) (rate(http_server_requests_seconds_sum{uri!~"/actuator.*"}[5m]))
            /
          sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))

  - name: pgms-backend
    rules:
      - alert: PgmsBackendDown
        expr: up{job="pgms-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend scrape target {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape /actuator/prometheus. Check `docker compose -p pgms ps backend` and backend logs (docs/OPERATIONS.md#backend-down)."

      - alert: PgmsHigh5xxRate
        expr: |
          pgms:http_5xx:rate5m / pgms:http_requests:rate5m > 0.05
          and pgms:http_requests:rate5m > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of API requests fail with 5xx ({{ $value | humanizePercentage }})"
          description: "Check the 'Errors by endpoint' panel and backend logs filtered by correlationId."

      # Needs histogram buckets: management.metrics.distribution.percentiles-histogram.http.server.requests=true
      # in the backend. Until that is enabled this rule evaluates to nothing and never fires; PgmsHighAvgLatency
      # below covers the gap.
      - alert: PgmsHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (application, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 1s ({{ $value | humanizeDuration }})"

      - alert: PgmsHighAvgLatency
        expr: pgms:http_latency_avg:5m > 0.5 and pgms:http_requests:rate5m > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Average API latency above 500ms ({{ $value | humanizeDuration }})"

      - alert: PgmsDbPoolSaturation
        expr: max by (application, pool) (hikaricp_connections_active / hikaricp_connections_max) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hikari pool {{ $labels.pool }} is {{ $value | humanizePercentage }} busy"
          description: "Slow queries or connection leaks. See docs/OPERATIONS.md#db-pool-saturation."

      - alert: PgmsDbPoolPendingThreads
        expr: max by (application, pool) (hikaricp_connections_pending) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Threads are waiting for a DB connection on pool {{ $labels.pool }}"

      - alert: PgmsDbConnectionTimeouts
        expr: sum by (application, pool) (increase(hikaricp_connections_timeout_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Requests timed out waiting for a DB connection ({{ $value }} in 5m)"

      - alert: PgmsJvmHeapHigh
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
            / sum by (application) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap above 90% for 10 minutes ({{ $value | humanizePercentage }})"

      - alert: PgmsAuthRateLimited
        expr: sum by (application) (increase(http_server_requests_seconds_count{uri=~"/api/v1/auth/.*", status="429"}[5m])) > 20
        labels:
          severity: info
        annotations:
          summary: "Many auth requests are being rate limited ({{ $value }} in 5m)"
          description: "Possible credential stuffing or a client stuck in a retry loop. See docs/OPERATIONS.md#rate-limited-users."
