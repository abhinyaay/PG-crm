# Prometheus for the local / single-host pgms stack (see docker-compose.observability.yml).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: local
    stack: pgms

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Spring Boot backend (Micrometer). /actuator/prometheus is permitAll inside the docker network and blocked by nginx.
  - job_name: pgms-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # The analytics service (FastAPI) exposes no /metrics endpoint yet. When it does, uncomment:
  # - job_name: pgms-analytics
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["analytics:8000"]
  #       labels:
  #         service: analytics
