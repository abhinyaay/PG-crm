# Edge reverse proxy for the single-host / docker-compose deployment.
# In AWS the ALB takes over routing and TLS; this file documents the same contract.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # structured access log, includes the request id that is propagated to the services
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
                                '"method":"$request_method","uri":"$request_uri","status":$status,'
                                '"bytes":$body_bytes_sent,"request_time":$request_time,'
                                '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # coarse per-IP limits; the backend applies a finer Redis-backed limit on credential endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Docker's embedded DNS; containers get new IPs when recreated, so names are re-resolved
    # continuously instead of only at startup (nginx >= 1.27.3 'resolve' on upstream servers)
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone upstream_backend 64k;
        server backend:8080 resolve;
        keepalive 32;
    }

    upstream analytics {
        zone upstream_analytics 64k;
        server analytics:8000 resolve;
        keepalive 16;
    }

    upstream frontend {
        zone upstream_frontend 64k;
        server frontend:80 resolve;
        keepalive 16;
    }

    # port the client actually used (e.g. a remapped host port) so the backend builds correct absolute URLs
    map $http_host $forwarded_port {
        ~:(?<p>[0-9]+)$ $p;
        default         $server_port;
    }

    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    server {
        listen 80;
        server_name _;

        # set once at the edge; hide upstream copies to avoid duplicate headers
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;   # keep the port so generated URLs (Swagger, Location) are correct
        proxy_set_header X-Real-IP $remote_addr;
        # edge proxy: overwrite (not append) so clients cannot spoof their IP into rate limits / audit rows
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Correlation-Id $correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        location ~ ^/api/v1/auth/(login|refresh)$ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
        }

        location /analytics/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://analytics;
        }

        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://backend;
        }

        # only health probes are public; metrics/prometheus stay on the internal network
        location = /health {
            proxy_pass http://backend/actuator/health/readiness;
        }

        location /actuator/ {
            return 404;
        }

        # everything else is the single-page web app (history fallback handled by the frontend container)
        location / {
            proxy_pass http://frontend;
        }
    }
}
