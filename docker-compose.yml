# Full local environment: docker compose up --build
# Configuration comes from .env (copy .env.example). No secrets are committed.
name: pgms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pgms
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-pgms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pgms"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # local SMTP server + web inbox for development: every email the platform sends lands here
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 5000
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: pgms-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_URL: jdbc:postgresql://postgres:5432/pgms
      DB_USERNAME: pgms_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY:-}
      APP_JWT_PUBLIC_KEY: ${APP_JWT_PUBLIC_KEY:-}
      APP_JWT_ALLOW_EPHEMERAL_KEYS: ${APP_JWT_ALLOW_EPHEMERAL_KEYS:-true}
      APP_JWT_KEY_ID: ${APP_JWT_KEY_ID:-pgms-key-1}
      APP_BOOTSTRAP_SUPER_ADMIN_EMAIL: ${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      # notifications: email goes to the local Mailpit inbox; SMS is logged unless a provider is configured
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      APP_NOTIFICATIONS_EMAIL_PROVIDER: ${APP_NOTIFICATIONS_EMAIL_PROVIDER:-smtp}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@pgms.local}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-PG Manager}
      APP_PORTAL_URL: ${APP_PORTAL_URL:-http://localhost}
      APP_NOTIFICATIONS_SMS_PROVIDER: ${APP_NOTIFICATIONS_SMS_PROVIDER:-log}
      APP_SMS_LOG_CONTENT: ${APP_SMS_LOG_CONTENT:-true}
      APP_TWILIO_ACCOUNT_SID: ${APP_TWILIO_ACCOUNT_SID:-}
      APP_TWILIO_AUTH_TOKEN: ${APP_TWILIO_AUTH_TOKEN:-}
      APP_TWILIO_FROM_NUMBER: ${APP_TWILIO_FROM_NUMBER:-}
      APP_MSG91_AUTH_KEY: ${APP_MSG91_AUTH_KEY:-}
      APP_MSG91_SENDER_ID: ${APP_MSG91_SENDER_ID:-}
    # direct port is for local debugging only (bypasses nginx); bound to loopback
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  analytics:
    build: ./analytics-service
    image: pgms-analytics:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy   # migrations (and the analytics views) are applied by the backend
    environment:
      DATABASE_URL: postgresql+psycopg://analytics_ro:${ANALYTICS_DB_PASSWORD}@postgres:5432/pgms
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWKS_URL: http://backend:8080/api/v1/auth/jwks
      JWT_ISSUER: ${APP_JWT_ISSUER:-pgms-auth}
      JWT_AUDIENCE: ${APP_JWT_AUDIENCE:-pgms-api}
      BUSINESS_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "127.0.0.1:${ANALYTICS_HOST_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    image: pgms-frontend:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      analytics:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
