# CI on every push/PR; CD (image publish + ECS deploy) on main only.
# AWS access uses GitHub OIDC -> IAM role assumption: no long-lived AWS keys are stored in GitHub.
# Publishing/deploying is switched on by the repository variable AWS_DEPLOY_ENABLED=true (Settings -> Variables)
# together with the secret AWS_DEPLOY_ROLE_ARN; until then CI only builds, tests and scans.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  BACKEND_REPOSITORY: pgms-backend
  ANALYTICS_REPOSITORY: pgms-analytics
  FRONTEND_REPOSITORY: pgms-frontend

jobs:
  backend:
    name: Backend - build, quality gates, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # validate -> checkstyle, test -> unit tests, integration-test -> Testcontainers (PostgreSQL + Redis),
      # verify -> JaCoCo coverage gate (75% lines)
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          retention-days: 14

  analytics:
    name: Analytics - lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            analytics-service/requirements.txt
            analytics-service/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: pytest with coverage gate
        run: pytest --cov=app --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-coverage
          path: analytics-service/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend - lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Frontend - Playwright e2e (docker compose stack)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:58088
    steps:
      - uses: actions/checkout@v4
      - name: Configure the stack (demo data, ephemeral JWT keys)
        run: |
          cp .env.example .env
          sed -i 's/^SPRING_PROFILES_ACTIVE=.*/SPRING_PROFILES_ACTIVE=docker,demo/' .env
          sed -i 's/^APP_DEMO_PASSWORD=.*/APP_DEMO_PASSWORD=Demo12345/' .env
          sed -i 's/^NGINX_HOST_PORT=.*/NGINX_HOST_PORT=58088/' .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Wait for the edge to serve the API
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:58088/health && exit 0; sleep 5; done
          docker compose ps; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e (desktop + mobile)
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
          retention-days: 14
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps > compose.log; tail -n 300 compose.log
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    name: Docker images - build, scan, publish
    needs: [backend, analytics, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write          # OIDC token for AWS
    outputs:
      backend-image: ${{ steps.refs.outputs.backend }}
      analytics-image: ${{ steps.refs.outputs.analytics }}
      frontend-image: ${{ steps.refs.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR (main only)
        id: ecr
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image references
        id: refs
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry || 'local' }}"
          echo "backend=$REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "analytics=$REGISTRY/$ANALYTICS_REPOSITORY:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "frontend=$REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ steps.refs.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build analytics image
        uses: docker/build-push-action@v6
        with:
          context: analytics-service
          load: true
          tags: ${{ steps.refs.outputs.analytics }}
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,mode=max,scope=analytics

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ steps.refs.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan backend image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.backend }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan analytics image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.analytics }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.frontend }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push images (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
        run: |
          docker push "${{ steps.refs.outputs.backend }}"
          docker push "${{ steps.refs.outputs.analytics }}"
          docker push "${{ steps.refs.outputs.frontend }}"

  deploy:
    name: Deploy to AWS ECS (production)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # protected environment: required reviewers gate the deployment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render backend task definition
        id: backend-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs/backend-task-definition.json
          container-name: backend
          image: ${{ needs.images.outputs.backend-image }}
      - name: Render analytics task definition
        id: analytics-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs/analytics-task-definition.json
          container-name: analytics
          image: ${{ needs.images.outputs.analytics-image }}

      # Backend first: its new tasks run Flyway (migrations must be backward compatible - expand/contract)
      # before the analytics service, which reads the analytics.* views, is rolled.
      - name: Deploy backend (rolling, waits for healthy targets)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-td.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER || 'pgms-prod' }}
          service: ${{ vars.ECS_BACKEND_SERVICE || 'pgms-backend' }}
          wait-for-service-stability: true
      - name: Deploy analytics
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.analytics-td.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER || 'pgms-prod' }}
          service: ${{ vars.ECS_ANALYTICS_SERVICE || 'pgms-analytics' }}
          wait-for-service-stability: true

      - name: Post-deploy health check
        run: |
          for i in $(seq 1 10); do
            # actuator is not routed publicly; the JWKS endpoint is public and exercises the full ALB -> task path
            if curl -fsS -H 'Cache-Control: no-cache' "${{ vars.PUBLIC_BASE_URL }}/api/v1/auth/jwks?probe=$GITHUB_SHA" >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "service did not become healthy" >&2; exit 1
