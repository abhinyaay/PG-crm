# Dependabot version updates. Weekly; minor + patch bumps are grouped into one PR per ecosystem/directory,
# major bumps arrive as individual PRs so they can be reviewed (and tested by CI) one at a time.
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(backend)" }
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    # major upgrades are planned work (breaking changes), not routine PRs
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /analytics-service
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(analytics)" }
    groups:
      analytics-minor-patch:
        update-types: [minor, patch]
    # major upgrades are planned work (breaking changes), not routine PRs
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(frontend)" }
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # base images of the three service Dockerfiles
    # major upgrades are planned work (breaking changes), not routine PRs
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/backend, /analytics-service, /frontend]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(docker)" }
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # images pinned in docker-compose.yml / docker-compose.observability.yml (postgres, redis, nginx, mailpit,
  # prometheus, grafana)
    # major upgrades are planned work (breaking changes), not routine PRs
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(compose)" }
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    # major upgrades are planned work (breaking changes), not routine PRs
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    commit-message: { prefix: "ci" }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    # major upgrades are planned work (breaking changes), not routine PRs
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
